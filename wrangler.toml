name = "train-liveboard"
main = "src/index.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "TOKEN_KV"
id = "1565511287804e53a9e7891055ac5cae"

# Every 5 minutes: keep the TDX token from expiring and fetch one station's
# timetable ahead of time if one is due (most runs call TDX zero times). Keep in
# step with CRON_INTERVAL_MS in src/index.js. Triggers are not inherited by
# [env.staging], so it has its own below.
[triggers]
crons = ["*/5 * * * *"]

# Keep logs (errors and "data anomaly" warnings) in the Cloudflare dashboard:
# Workers & Pages > train-liveboard > Logs. Free plan: kept for 3 days.
[observability]
enabled = true

# Staging: a separate Worker (different workers.dev URL), its own KV
# namespace so staging's cache never touches production's, and its own
# secrets (set separately with `wrangler secret put <NAME> --env staging`).
[env.staging]
name = "train-liveboard-staging"

[[env.staging.kv_namespaces]]
binding = "TOKEN_KV"
id = "b053a6ff7eff467086d6423b65be1a03"

# Staging only keeps its token alive: it shares the API key, so prefetching
# there would spend production's quota.
[env.staging.triggers]
crons = ["0 */2 * * *"]

[env.staging.vars]
PREFETCH = "off"

[env.staging.observability]
enabled = true
