<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="台鐵看板" />
<meta name="theme-color" content="#0f172a" />
<title>台鐵即時看板</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --delay: #f87171;
    --suspended: #94a3b8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    min-height: 100vh;
    padding: env(safe-area-inset-top, 16px) 16px calc(env(safe-area-inset-bottom, 16px) + 16px);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .wrap {
    width: 100%;
    max-width: 480px;
  }
  header {
    text-align: center;
    padding: 20px 0 12px;
  }
  header h1 {
    font-size: 24px;
    margin: 0;
    font-weight: 700;
  }
  header p {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 15px;
  }
  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .controls select {
    flex: 1;
    min-width: 0;
    background: var(--card);
    color: var(--text);
    border: 1px solid rgba(148, 163, 184, 0.3);
    border-radius: 12px;
    padding: 12px 10px;
    font-size: 15px;
    font-family: inherit;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .train {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 4px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.15);
  }
  .train:last-child { border-bottom: none; }
  .train.suspended { opacity: 0.55; }
  .train .time {
    font-size: 32px;
    font-weight: 700;
    min-width: 88px;
  }
  .train.suspended .time {
    text-decoration: line-through;
  }
  .train .mid {
    flex: 1;
    padding: 0 12px;
    min-width: 0;
  }
  .train .trainNo {
    font-size: 18px;
    font-weight: 600;
  }
  .train .meta {
    font-size: 15px;
    color: var(--muted);
    margin-top: 2px;
  }
  .train .delay {
    font-size: 16px;
    font-weight: 700;
    color: var(--delay);
    white-space: nowrap;
  }
  .train .suspended-tag {
    font-size: 16px;
    font-weight: 700;
    color: var(--suspended);
    white-space: nowrap;
  }
  .more-btn {
    display: block;
    width: 100%;
    margin-top: 4px;
    padding: 14px;
    border: 1px solid rgba(148, 163, 184, 0.3);
    border-radius: 14px;
    background: transparent;
    color: var(--accent);
    font-size: 16px;
    font-weight: 600;
  }
  .empty, .loading, .err {
    text-align: center;
    color: var(--muted);
    font-size: 17px;
    padding: 36px 8px;
  }
  .err { color: var(--delay); }
  .updated {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-top: 4px;
  }
  .disclaimer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.6;
    margin-top: 10px;
    padding: 0 8px;
  }
  details {
    background: var(--card);
    border-radius: 16px;
    padding: 14px 16px;
    margin-top: 18px;
  }
  summary {
    font-size: 16px;
    font-weight: 600;
    color: var(--accent);
    cursor: pointer;
    list-style: none;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after {
    content: " ▾";
  }
  details[open] summary::after {
    content: " ▴";
  }
  .howto {
    margin-top: 12px;
    font-size: 15px;
    line-height: 1.8;
    color: var(--text);
  }
  .howto h3 {
    font-size: 15px;
    color: var(--accent);
    margin: 14px 0 4px;
  }
  .howto h3:first-child { margin-top: 0; }
  .refresh-btn {
    display: block;
    width: 100%;
    margin-top: 14px;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: var(--accent);
    color: #04202f;
    font-size: 17px;
    font-weight: 700;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">🚆 台鐵即時看板</h1>
    <p id="subtitle">查詢中…</p>
  </header>

  <div class="controls">
    <select id="stationSelect" aria-label="車站"><option>載入車站中…</option></select>
    <select id="directionSelect" aria-label="方向"></select>
  </div>

  <div class="card">
    <div id="list" class="loading">查詢中…</div>
    <div id="updated" class="updated"></div>
  </div>

  <button class="more-btn" id="moreBtn" style="display:none">顯示到今天最後一班</button>
  <button class="refresh-btn" id="refreshBtn">重新查詢</button>

  <p class="disclaimer">
    本資料為台鐵時刻表加上誤點資訊所合成，約有 2 分鐘延遲，並非車站第一手資料，僅供參考。
  </p>

  <details>
    <summary>怎麼把這個網頁加到手機主畫面？</summary>
    <div class="howto">
      <h3>📱 iPhone（Safari）</h3>
      <p>
        用 Safari 瀏覽器打開這個網頁 → 按下方中間的「分享」圖示（方框加箭頭）
        → 往下找「加入主畫面」→ 按「加入」。
      </p>
      <h3>🤖 Android（Chrome）</h3>
      <p>
        用 Chrome 瀏覽器打開這個網頁 → 按右上角「⋮」三個點
        → 選「新增至主畫面」或「安裝應用程式」→ 按「新增」。
      </p>
      <p style="color: var(--muted); font-size: 13px;">
        加入後，手機桌面會多一個圖示，點一下就能直接查看，跟開 App 一樣方便。
      </p>
    </div>
  </details>
</div>

<script>
  const WINDOW_MINUTES = 60;
  const REFRESH_MS = 3 * 60 * 1000; // match the backend's live-board cache window
  const STORAGE_STATION = "train-liveboard:station";
  const STORAGE_DIRECTION_PREFIX = "train-liveboard:direction:";
  const DEFAULT_STATION = "0940"; // 百福

  const titleEl = document.getElementById("title");
  const subtitleEl = document.getElementById("subtitle");
  const stationSelect = document.getElementById("stationSelect");
  const directionSelect = document.getElementById("directionSelect");
  const listEl = document.getElementById("list");
  const updatedEl = document.getElementById("updated");
  const refreshBtn = document.getElementById("refreshBtn");
  const moreBtn = document.getElementById("moreBtn");

  let allTrains = [];
  let showAll = false;
  let refreshTimer = null;
  let lastData = null;

  function storageGet(key) {
    try {
      return localStorage.getItem(key);
    } catch {
      return null;
    }
  }
  function storageSet(key, value) {
    try {
      localStorage.setItem(key, value);
    } catch {
      /* ignore (private browsing etc.) */
    }
  }

  function fmtUpdateTime(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    const hh = String(d.getHours()).padStart(2, "0");
    const mm = String(d.getMinutes()).padStart(2, "0");
    return `資料時間 ${hh}:${mm}`;
  }

  function trainHtml(t) {
    let badge = "";
    if (t.suspended) {
      badge = `<div class="suspended-tag">今日停駛</div>`;
    } else if (t.delayMinutes > 0) {
      badge = `<div class="delay">誤點 ${t.delayMinutes} 分</div>`;
    }
    return `
      <div class="train ${t.suspended ? "suspended" : ""}">
        <div class="time">${t.time.slice(0, 5)}</div>
        <div class="mid">
          <div class="trainNo">${t.trainType} ${t.trainNo}</div>
          <div class="meta">往 ${t.destination}</div>
        </div>
        ${badge}
      </div>
    `;
  }

  function renderList() {
    const visible = showAll
      ? allTrains
      : allTrains.filter((t) => t.suspended || t.diffMinutes <= WINDOW_MINUTES);

    if (visible.length === 0) {
      listEl.className = "empty";
      listEl.textContent = showAll ? "今天沒有更多列車了" : `接下來 ${WINDOW_MINUTES} 分鐘內沒有列車`;
    } else {
      listEl.className = "";
      listEl.innerHTML = visible.map(trainHtml).join("");
    }

    const hasMore = allTrains.some((t) => !t.suspended && t.diffMinutes > WINDOW_MINUTES);
    moreBtn.style.display = hasMore ? "block" : "none";
    moreBtn.textContent = showAll ? "收合" : "顯示到今天最後一班";
  }

  function populateDirections(stationId, directionOptions) {
    const savedDirection = storageGet(STORAGE_DIRECTION_PREFIX + stationId);
    directionSelect.innerHTML = directionOptions
      .map((d) => `<option value="${d.value}">${d.label}</option>`)
      .join("");
    const validValues = directionOptions.map((d) => String(d.value));
    // With nothing saved yet, default to southbound (value 1) when available —
    // e.g. Baifu's default view is southbound, matching the original design.
    const defaultValue = validValues.includes("1") ? "1" : directionOptions[0]?.value ?? "";
    directionSelect.value = validValues.includes(savedDirection) ? savedDirection : defaultValue;
  }

  // Re-renders from the last fetched response using whatever direction is
  // currently selected — no network call needed to switch direction.
  function applyDirection() {
    if (!lastData) return;
    const selectedDirection = Number(directionSelect.value);
    const directionLabel =
      lastData.directionOptions.find((d) => d.value === selectedDirection)?.label || "";

    titleEl.textContent = `🚆 ${lastData.stationName}站 · ${directionLabel}`;
    subtitleEl.textContent = `接下來 ${WINDOW_MINUTES} 分鐘內的${directionLabel}列車`;

    allTrains = (lastData.trains || []).filter((t) => t.direction === selectedDirection);
    showAll = false;
    renderList();
    updatedEl.textContent = fmtUpdateTime(lastData.updateTime);
  }

  let lastLoadAt = 0;
  const MIN_LOAD_GAP_MS = 20 * 1000; // guard against any runaway/duplicate triggers

  async function load({ force = false } = {}) {
    const stationId = stationSelect.value;
    if (!stationId) return;
    if (!force && Date.now() - lastLoadAt < MIN_LOAD_GAP_MS) return;
    lastLoadAt = Date.now();

    listEl.className = "loading";
    listEl.textContent = "查詢中…";
    try {
      const resp = await fetch(`/api/liveboard?station=${encodeURIComponent(stationId)}`);
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || "查詢失敗");

      lastData = data;
      populateDirections(stationId, data.directionOptions);
      applyDirection();
    } catch (err) {
      listEl.className = "err";
      listEl.textContent = "查詢失敗，請稍後再試";
    }
  }

  async function loadStations() {
    const resp = await fetch("/api/stations");
    const data = await resp.json();

    const byCity = new Map();
    for (const s of data.stations) {
      const city = s.city || "其他";
      if (!byCity.has(city)) byCity.set(city, []);
      byCity.get(city).push(s);
    }

    const savedStation = storageGet(STORAGE_STATION) || DEFAULT_STATION;
    stationSelect.innerHTML = [...byCity.entries()]
      .map(
        ([city, stations]) =>
          `<optgroup label="${city}">` +
          stations.map((s) => `<option value="${s.id}">${s.name}</option>`).join("") +
          `</optgroup>`
      )
      .join("");

    const validIds = data.stations.map((s) => s.id);
    stationSelect.value = validIds.includes(savedStation) ? savedStation : DEFAULT_STATION;
  }

  function resetRefreshTimer() {
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(() => {
      if (!document.hidden) load();
    }, REFRESH_MS);
  }

  stationSelect.addEventListener("change", () => {
    storageSet(STORAGE_STATION, stationSelect.value);
    load({ force: true });
  });
  directionSelect.addEventListener("change", () => {
    storageSet(STORAGE_DIRECTION_PREFIX + stationSelect.value, directionSelect.value);
    applyDirection(); // instant, client-side only — same data, different filter
  });
  refreshBtn.addEventListener("click", () => load({ force: true }));
  moreBtn.addEventListener("click", () => {
    showAll = !showAll;
    renderList();
  });
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) load(); // catch up when the page comes back to front, throttled by MIN_LOAD_GAP_MS
  });

  (async function init() {
    await loadStations();
    await load({ force: true });
    resetRefreshTimer();
  })();
</script>
</body>
</html>
