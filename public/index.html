<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="台鐵看板" />
<meta name="theme-color" content="#0f172a" />
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f172a'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle'%3E%F0%9F%9A%86%3C/text%3E%3C/svg%3E" />
<title>台鐵即時看板</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #f9a8c4;
    --delay: #f87171;
    --suspended: #94a3b8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    min-height: 100vh;
    padding: env(safe-area-inset-top, 14px) 16px calc(env(safe-area-inset-bottom, 14px) + 14px);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .wrap {
    width: 100%;
    max-width: 480px;
  }
  header {
    text-align: center;
    padding: 4px 0 16px;
  }
  header h1 {
    font-size: 19px;
    margin: 0;
    font-weight: 700;
  }
  .board {
    margin-bottom: 18px;
  }
  .board-title {
    font-size: 17px;
    font-weight: 700;
    margin: 0 2px 8px;
  }
  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .controls select {
    flex: 1;
    min-width: 0;
    background: var(--card);
    color: var(--text);
    border: 1px solid rgba(148, 163, 184, 0.3);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 8px 14px;
    margin-bottom: 8px;
  }
  .train {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 2px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.15);
  }
  .train:last-child { border-bottom: none; }
  .train.suspended { opacity: 0.55; }
  .train .time {
    font-size: 26px;
    font-weight: 700;
    min-width: 70px;
  }
  .train.suspended .time {
    text-decoration: line-through;
  }
  .train .mid {
    flex: 1;
    padding: 0 10px;
    min-width: 0;
  }
  .train .trainNo {
    font-size: 16px;
    font-weight: 600;
  }
  .train .meta {
    font-size: 13px;
    color: var(--muted);
    margin-top: 1px;
  }
  .train.skip .time,
  .train.skip .trainNo {
    color: var(--muted);
  }
  .skip-tag {
    font-size: 13px;
    font-weight: 600;
    margin-left: 2px;
    white-space: nowrap;
  }
  .train .delay {
    font-size: 14px;
    font-weight: 700;
    color: var(--delay);
    white-space: nowrap;
  }
  .train .suspended-tag {
    font-size: 14px;
    font-weight: 700;
    color: var(--suspended);
    white-space: nowrap;
  }
  .more-btn {
    display: block;
    width: 100%;
    padding: 11px;
    border: 1px solid rgba(148, 163, 184, 0.3);
    border-radius: 12px;
    background: transparent;
    color: var(--accent);
    font-size: 14px;
    font-weight: 600;
  }
  .empty, .loading, .err {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 12px 8px;
  }
  .err { color: var(--delay); }
  .updated {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    margin: 2px 0 4px;
  }
  .disclaimer {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.5;
    margin-top: 4px;
    padding: 0 8px;
  }
  details {
    background: var(--card);
    border-radius: 16px;
    padding: 12px 16px;
    margin-top: 10px;
  }
  summary {
    font-size: 16px;
    font-weight: 600;
    color: var(--accent);
    cursor: pointer;
    list-style: none;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after {
    content: " ▾";
  }
  details[open] summary::after {
    content: " ▴";
  }
  .howto {
    margin-top: 12px;
    font-size: 15px;
    line-height: 1.8;
    color: var(--text);
  }
  .howto h3 {
    font-size: 15px;
    color: var(--accent);
    margin: 14px 0 4px;
  }
  .howto h3:first-child { margin-top: 0; }
  .refresh-btn {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: var(--accent);
    color: #4a1730;
    font-size: 16px;
    font-weight: 700;
  }
  header h1 {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .cat-head {
    width: 33px;
    height: 27px;
    display: block;
  }
  .paw {
    width: 1em;
    height: 0.89em;
    vertical-align: -0.06em;
    margin-right: 6px;
  }
  .board-title .paw { color: var(--accent); }
  .state-cat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .state-cat .cat-head { width: 44px; height: 36px; }
  .loading .cat-head { animation: hop 0.7s infinite; }
  @keyframes hop {
    0%, 49% { transform: translateY(0); }
    50%, 100% { transform: translateY(-4px); }
  }
  .cat-sleep { width: 93px; height: 72px; display: block; }
  .px-Z, .px-z { animation: blink 2.4s ease-in-out infinite; }
  .px-z { animation-delay: 0.8s; }
  @keyframes blink {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 1; }
  }
  .peek-wrap {
    display: flex;
    justify-content: center;
    margin-top: 22px;
    border-bottom: 4px solid var(--card);
  }
  .cat-peek { width: 88px; height: 56px; display: block; }
  .bye {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin: 6px 0 0;
  }
  @media (prefers-reduced-motion: reduce) {
    .loading .cat-head, .px-Z, .px-z { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span id="headerCat"></span>台鐵即時看板</h1>
  </header>

  <div class="board" id="board-a">
    <div class="board-title"><span class="paw-slot"></span><span id="title-a">南下</span></div>
    <div class="controls">
      <select id="stationSelect-a" aria-label="車站"><option>載入車站中…</option></select>
      <select id="directionSelect-a" aria-label="方向"></select>
    </div>
    <div class="card">
      <div id="list-a" class="loading">查詢中…</div>
      <div id="updated-a" class="updated"></div>
    </div>
    <button class="more-btn" id="moreBtn-a" style="display:none">顯示到今天最後一班</button>
  </div>

  <div class="board" id="board-b">
    <div class="board-title"><span class="paw-slot"></span><span id="title-b">北上</span></div>
    <div class="controls">
      <select id="stationSelect-b" aria-label="車站"><option>載入車站中…</option></select>
      <select id="directionSelect-b" aria-label="方向"></select>
    </div>
    <div class="card">
      <div id="list-b" class="loading">查詢中…</div>
      <div id="updated-b" class="updated"></div>
    </div>
    <button class="more-btn" id="moreBtn-b" style="display:none">顯示到今天最後一班</button>
  </div>

  <button class="refresh-btn" id="refreshBtn"><span class="paw-slot"></span>重新查詢</button>

  <p class="disclaimer">
    本資料為台鐵時刻表加上誤點資訊所合成，約有 2 分鐘延遲，並非車站第一手資料，僅供參考。
  </p>

  <details>
    <summary>怎麼把這個網頁加到手機主畫面？</summary>
    <div class="howto">
      <h3>📱 iPhone（Safari）</h3>
      <p>
        用 Safari 瀏覽器打開這個網頁 → 按下方中間的「分享」圖示（方框加箭頭）
        → 往下找「加入主畫面」→ 按「加入」。
      </p>
      <h3>🤖 Android（Chrome）</h3>
      <p>
        用 Chrome 瀏覽器打開這個網頁 → 按右上角「⋮」三個點
        → 選「新增至主畫面」或「安裝應用程式」→ 按「新增」。
      </p>
      <p style="color: var(--muted); font-size: 13px;">
        加入後，手機桌面會多一個圖示，點一下就能直接查看，跟開 App 一樣方便。
      </p>
    </div>
  </details>

  <div class="peek-wrap" id="footerCat"></div>
  <p class="bye">出門小心，喵～</p>
</div>

<script>
  // Pixel-art mascot modeled on the family cat: white long fur, black ears
  // with a middle-parted black cap, yellow-green eyes, pink nose, black tail.
  // Each string is one row of pixels; "." is transparent.
  const CAT_COLORS = {
    K: "#26262b", // black fur
    W: "#ffffff",
    G: "#b7cc3c", // eyes
    P: "#f2a0b0", // nose
    R: "#e98aa0", // open mouth
    B: "#f9c2d4", // blush
    S: "#9aa3b5", // mouth / toe lines
    O: "#64748b", // outline so black fur shows on the dark page
    Z: "#94a3b8",
    z: "#94a3b8",
    X: "currentColor",
  };
  const W20 = "W".repeat(20);
  const CAT_TOP = [
    "..K..............K..",
    ".KKK............KKK.",
    ".KKWK..........KWKK.",
    ".KKKKKKKWWWWKKKKKKK.",
    "WKKKKKKWWWWWWKKKKKKW",
    "WWKKKKWWWWWWWWKKKKWW",
    "WWWKKWWWWWWWWWWKKWWW",
    W20,
  ];
  const CAT_EYES_OPEN = [
    "WWWWWGGWWWWWWGGWWWWW",
    "WWWWGWKGWWWWGWKGWWWW",
    "WWWWGKKGWWWWGKKGWWWW",
    "WWWWWGGWWWWWWGGWWWWW",
  ];
  const CAT_EYES_SHUT = [W20, W20, "WWWWKWWKWWWWKWWKWWWW", "WWWWWKKWWWWWWKKWWWWW"];
  const CAT_CHEEKS = "WWBBWWWWWPPWWWWWBBWW";
  const CAT_CHIN = "..WWWWWWWWWWWWWWWW..";
  const CAT_MOUTH_HAPPY = [CAT_CHEEKS, "WWWWWWWWSWWSWWWWWWWW", ".WWWWWWWWRRWWWWWWWW.", CAT_CHIN];
  const CAT_MOUTH_SHUT = [CAT_CHEEKS, "WWWWWWWWSWWSWWWWWWWW", ".WWWWWWWWSSWWWWWWWW.", CAT_CHIN];
  const CAT_MOUTH_SAD = [CAT_CHEEKS, "WWWWWWWWWSSWWWWWWWWW", ".WWWWWWWSWWSWWWWWWW.", CAT_CHIN];
  const CAT_BODY = [
    "...WWWWWWWWWWWWW..KK",
    "..WWWWWWWWWWWWWW.KKK",
    "..KKWWWWWWWWWWWWKKKK",
    ".KKKKWWWWWWWWWWWKKKK",
    ".KKKKWWSWWWWSWWWKKK.",
    "..KKWWWSWWWWSWWWKK..",
  ];
  const PAW_ROWS = [
    "..XX.XX..",
    "..XX.XX..",
    "XX.....XX",
    "XX.XXX.XX",
    "..XXXXX..",
    ".XXXXXXX.",
    ".XXXXXXX.",
    "..XXXXX..",
  ];

  // Pads the sprite by one pixel and outlines the black fur.
  function outlined(rows) {
    const w = rows[0].length;
    const g = [".".repeat(w + 2), ...rows.map((r) => `.${r}.`), ".".repeat(w + 2)].map((r) => [...r]);
    const isK = (y, x) => g[y]?.[x] === "K";
    return g.map((row, y) =>
      row
        .map((ch, x) =>
          ch === "." && (isK(y - 1, x) || isK(y + 1, x) || isK(y, x - 1) || isK(y, x + 1)) ? "O" : ch
        )
        .join("")
    );
  }

  function pixelRects(rows) {
    let out = "";
    rows.forEach((row, y) => {
      for (let x = 0; x < row.length; ) {
        const ch = row[x];
        let run = 1;
        while (row[x + run] === ch) run++;
        if (CAT_COLORS[ch]) {
          out += `<rect class="px-${ch}" x="${x}" y="${y}" width="${run}" height="1" fill="${CAT_COLORS[ch]}"/>`;
        }
        x += run;
      }
    });
    return out;
  }
  const pixelSvg = (rows, cls) =>
    `<svg class="${cls}" viewBox="0 0 ${rows[0].length} ${rows.length}" shape-rendering="crispEdges" aria-hidden="true">${pixelRects(rows)}</svg>`;

  const CAT_FACE = outlined([...CAT_TOP, ...CAT_EYES_OPEN, ...CAT_MOUTH_HAPPY]);
  const catFaceSvg = ({ sad = false } = {}) =>
    pixelSvg(sad ? outlined([...CAT_TOP, ...CAT_EYES_OPEN, ...CAT_MOUTH_SAD]) : CAT_FACE, "cat-head");

  function sleepingCatSvg() {
    const rows = [...CAT_TOP, ...CAT_EYES_SHUT, ...CAT_MOUTH_SHUT, ...CAT_BODY].map((r) => [
      ...r.padEnd(29, "."),
    ]);
    const stamp = (x, y, art) =>
      art.forEach((line, dy) => [...line].forEach((ch, dx) => ch !== "." && (rows[y + dy][x + dx] = ch)));
    stamp(26, 0, ["zzz", ".z.", "zzz"]);
    stamp(21, 3, ["ZZZZ", "..Z.", ".Z..", "ZZZZ"]);
    return pixelSvg(outlined(rows.map((r) => r.join(""))), "cat-sleep");
  }

  // Head and front paws only, resting on the ledge drawn by .peek-wrap.
  const peekingCatSvg = () =>
    pixelSvg(
      outlined([...CAT_TOP, ...CAT_EYES_OPEN, "WWSWSWWWWWWWWWWSWSWW"]).slice(0, -1),
      "cat-peek"
    );

  const PAW_SVG = pixelSvg(PAW_ROWS, "paw");

  const stateHtml = (art, text) => `<div class="state-cat">${art}<div>${text}</div></div>`;

  document.getElementById("headerCat").innerHTML = catFaceSvg();
  document.getElementById("footerCat").innerHTML = peekingCatSvg();
  document.querySelectorAll(".paw-slot").forEach((el) => (el.innerHTML = PAW_SVG));
  document.getElementById("favicon").href =
    "data:image/svg+xml," +
    encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -4 26 26" shape-rendering="crispEdges"><rect x="-2" y="-4" width="26" height="26" fill="#a7f3d0"/>${pixelRects(CAT_FACE)}</svg>`
    );

  const DEFAULT_COUNT = 3; // show the N nearest trains by default
  const REFRESH_MS = 3 * 60 * 1000; // match the backend's live-board cache window
  const MIN_LOAD_GAP_MS = 20 * 1000; // guard against any runaway/duplicate triggers
  // A screen left on all day would burn the TDX monthly quota in days, so
  // auto-refresh stops after this long without the viewer touching anything.
  const AUTO_REFRESH_LIMIT_MS = 15 * 60 * 1000;
  let activeSince = Date.now();
  const markActive = () => { activeSince = Date.now(); };

  function storageGet(key) {
    try {
      return localStorage.getItem(key);
    } catch {
      return null;
    }
  }
  function storageSet(key, value) {
    try {
      localStorage.setItem(key, value);
    } catch {
      /* ignore (private browsing etc.) */
    }
  }

  function fmtUpdateTime(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    const hh = String(d.getHours()).padStart(2, "0");
    const mm = String(d.getMinutes()).padStart(2, "0");
    return `資料時間 ${hh}:${mm}`;
  }

  function trainHtml(t) {
    let badge = "";
    if (t.suspended) {
      badge = `<div class="suspended-tag">今日停駛</div>`;
    } else if (t.delayMinutes > 0) {
      badge = `<div class="delay">誤點 ${t.delayMinutes} 分</div>`;
    }
    return `
      <div class="train ${t.suspended ? "suspended" : ""} ${t.skipsBaifu ? "skip" : ""}">
        <div class="time">${t.time.slice(0, 5)}</div>
        <div class="mid">
          <div class="trainNo">${t.trainType} ${t.trainNo}${t.skipsBaifu ? `<span class="skip-tag">（百福不停）</span>` : ""}</div>
          <div class="meta">往 ${t.destination}</div>
        </div>
        ${badge}
      </div>
    `;
  }

  // One `Board` = one station + direction picker, independently configurable
  // and persisted, so two boards can show e.g. 百福 southbound and 汐科
  // northbound side by side.
  function createBoard({ suffix, defaultStation, preferredDirection }) {
    const el = (id) => document.getElementById(`${id}-${suffix}`);
    const titleEl = el("title");
    const stationSelect = el("stationSelect");
    const directionSelect = el("directionSelect");
    const listEl = el("list");
    const updatedEl = el("updated");
    const moreBtn = el("moreBtn");

    const STORAGE_STATION = `train-liveboard:station:${suffix}`;
    const STORAGE_DIRECTION_PREFIX = `train-liveboard:direction:${suffix}:`;

    let allTrains = [];
    let showAll = false;
    let lastData = null;
    let stationsReady = false;
    let lastLoadAt = 0;

    function renderList() {
      const visible = showAll ? allTrains : allTrains.slice(0, DEFAULT_COUNT);

      if (visible.length === 0) {
        listEl.className = "empty";
        listEl.innerHTML = stateHtml(sleepingCatSvg(), "今天的車都開走了，貓咪先睡囉");
      } else {
        listEl.className = "";
        listEl.innerHTML = visible.map(trainHtml).join("");
      }

      const hasMore = allTrains.length > DEFAULT_COUNT;
      moreBtn.style.display = hasMore ? "block" : "none";
      moreBtn.textContent = showAll ? "收合" : "顯示到今天最後一班";
    }

    function populateDirections(stationId, directionOptions) {
      const savedDirection = storageGet(STORAGE_DIRECTION_PREFIX + stationId);
      directionSelect.innerHTML = directionOptions
        .map((d) => `<option value="${d.value}">${d.label}</option>`)
        .join("");
      const validValues = directionOptions.map((d) => String(d.value));
      const fallback = validValues.includes(String(preferredDirection))
        ? String(preferredDirection)
        : directionOptions[0]?.value ?? "";
      directionSelect.value = validValues.includes(savedDirection) ? savedDirection : fallback;
    }

    // Re-renders from the last fetched response using whatever direction is
    // currently selected — no network call needed to switch direction.
    function applyDirection() {
      if (!lastData) return;
      const selectedDirection = Number(directionSelect.value);
      const directionLabel =
        lastData.directionOptions.find((d) => d.value === selectedDirection)?.label || "";

      titleEl.textContent = `${lastData.stationName}站 · ${directionLabel}`;

      allTrains = (lastData.trains || []).filter((t) => t.direction === selectedDirection);
      showAll = false;
      renderList();
      updatedEl.textContent = fmtUpdateTime(lastData.updateTime);
    }

    async function load({ force = false } = {}) {
      if (!stationsReady) return; // avoid racing ahead of the station dropdown's initial load
      const stationId = stationSelect.value;
      if (!stationId) return;
      if (!force && Date.now() - lastLoadAt < MIN_LOAD_GAP_MS) return;
      lastLoadAt = Date.now();

      // Background auto-refreshes keep the current list instead of making it
      // jump to a loading state every 3 minutes.
      if (force || !lastData || lastData.stationId !== stationId) {
        listEl.className = "loading";
        listEl.innerHTML = stateHtml(catFaceSvg(), "查詢中…");
      }
      try {
        const resp = await fetch(`/api/liveboard?station=${encodeURIComponent(stationId)}`);
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || "查詢失敗");

        lastData = data;
        populateDirections(stationId, data.directionOptions);
        applyDirection();
      } catch (err) {
        listEl.className = "err";
        listEl.innerHTML = stateHtml(catFaceSvg({ sad: true }), "喵嗚…查詢失敗，請稍後再試");
      }
    }

    function populateStations(stations) {
      const savedStation = storageGet(STORAGE_STATION) || defaultStation;
      stationSelect.innerHTML = stations
        .map((s) => `<option value="${s.id}">${s.name}</option>`)
        .join("");

      const validIds = stations.map((s) => s.id);
      stationSelect.value = validIds.includes(savedStation) ? savedStation : defaultStation;
      stationsReady = true;
    }

    stationSelect.addEventListener("change", () => {
      markActive();
      storageSet(STORAGE_STATION, stationSelect.value);
      load({ force: true });
    });
    directionSelect.addEventListener("change", () => {
      storageSet(STORAGE_DIRECTION_PREFIX + stationSelect.value, directionSelect.value);
      applyDirection(); // instant, client-side only — same data, different filter
    });
    moreBtn.addEventListener("click", () => {
      showAll = !showAll;
      renderList();
    });

    return {
      async init(stations) {
        populateStations(stations);
        await load({ force: true });
      },
      refresh: () => load({ force: false }),
      forceRefresh: () => load({ force: true }),
      showPaused() {
        if (!lastData) return;
        updatedEl.textContent = `${fmtUpdateTime(lastData.updateTime)} · 已暫停自動更新，請按「重新查詢」`;
      },
    };
  }

  // A short, curated list of nearby stations — not the full ~245 TRA
  // stations, since the family only ever uses this handful.
  const COMMON_STATIONS = [
    { id: "0930", name: "七堵" },
    { id: "0940", name: "百福" },
    { id: "0960", name: "汐止" },
    { id: "0970", name: "汐科" },
    { id: "0990", name: "松山" },
    { id: "1000", name: "臺北" },
  ];

  const boardA = createBoard({ suffix: "a", defaultStation: "0940", preferredDirection: 1 }); // 百福 · 南下
  const boardB = createBoard({ suffix: "b", defaultStation: "0970", preferredDirection: 0 }); // 汐科 · 北上
  const boards = [boardA, boardB];

  const refreshBtn = document.getElementById("refreshBtn");
  refreshBtn.addEventListener("click", () => {
    markActive();
    boards.forEach((b) => b.forceRefresh());
  });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) return;
    markActive();
    boards.forEach((b) => b.refresh()); // throttled per-board by MIN_LOAD_GAP_MS
  });

  (async function init() {
    await Promise.all(boards.map((b) => b.init(COMMON_STATIONS)));
    setInterval(() => {
      if (document.hidden) return;
      if (Date.now() - activeSince > AUTO_REFRESH_LIMIT_MS) {
        boards.forEach((b) => b.showPaused());
        return;
      }
      boards.forEach((b) => b.refresh());
    }, REFRESH_MS);
  })();
</script>
</body>
</html>
