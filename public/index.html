<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="台鐵看板" />
<meta name="theme-color" content="#0f172a" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f172a'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle'%3E%F0%9F%9A%86%3C/text%3E%3C/svg%3E" />
<title>台鐵即時看板</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --delay: #f87171;
    --suspended: #94a3b8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    min-height: 100vh;
    padding: env(safe-area-inset-top, 14px) 16px calc(env(safe-area-inset-bottom, 14px) + 14px);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .wrap {
    width: 100%;
    max-width: 480px;
  }
  header {
    text-align: center;
    padding: 4px 0 16px;
  }
  header h1 {
    font-size: 19px;
    margin: 0;
    font-weight: 700;
  }
  .board {
    margin-bottom: 18px;
  }
  .board-title {
    font-size: 17px;
    font-weight: 700;
    margin: 0 2px 8px;
  }
  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .controls select {
    flex: 1;
    min-width: 0;
    background: var(--card);
    color: var(--text);
    border: 1px solid rgba(148, 163, 184, 0.3);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 8px 14px;
    margin-bottom: 8px;
  }
  .train {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 2px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.15);
  }
  .train:last-child { border-bottom: none; }
  .train.suspended { opacity: 0.55; }
  .train .time {
    font-size: 26px;
    font-weight: 700;
    min-width: 70px;
  }
  .train.suspended .time {
    text-decoration: line-through;
  }
  .train .mid {
    flex: 1;
    padding: 0 10px;
    min-width: 0;
  }
  .train .trainNo {
    font-size: 16px;
    font-weight: 600;
  }
  .train .meta {
    font-size: 13px;
    color: var(--muted);
    margin-top: 1px;
  }
  .train .delay {
    font-size: 14px;
    font-weight: 700;
    color: var(--delay);
    white-space: nowrap;
  }
  .train .suspended-tag {
    font-size: 14px;
    font-weight: 700;
    color: var(--suspended);
    white-space: nowrap;
  }
  .more-btn {
    display: block;
    width: 100%;
    padding: 11px;
    border: 1px solid rgba(148, 163, 184, 0.3);
    border-radius: 12px;
    background: transparent;
    color: var(--accent);
    font-size: 14px;
    font-weight: 600;
  }
  .empty, .loading, .err {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 12px 8px;
  }
  .err { color: var(--delay); }
  .updated {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    margin: 2px 0 4px;
  }
  .disclaimer {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.5;
    margin-top: 4px;
    padding: 0 8px;
  }
  details {
    background: var(--card);
    border-radius: 16px;
    padding: 12px 16px;
    margin-top: 10px;
  }
  summary {
    font-size: 16px;
    font-weight: 600;
    color: var(--accent);
    cursor: pointer;
    list-style: none;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after {
    content: " ▾";
  }
  details[open] summary::after {
    content: " ▴";
  }
  .howto {
    margin-top: 12px;
    font-size: 15px;
    line-height: 1.8;
    color: var(--text);
  }
  .howto h3 {
    font-size: 15px;
    color: var(--accent);
    margin: 14px 0 4px;
  }
  .howto h3:first-child { margin-top: 0; }
  .refresh-btn {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: var(--accent);
    color: #04202f;
    font-size: 16px;
    font-weight: 700;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🚆 台鐵即時看板</h1>
  </header>

  <div class="board" id="board-a">
    <div class="board-title" id="title-a">南下</div>
    <div class="controls">
      <select id="stationSelect-a" aria-label="車站"><option>載入車站中…</option></select>
      <select id="directionSelect-a" aria-label="方向"></select>
    </div>
    <div class="card">
      <div id="list-a" class="loading">查詢中…</div>
      <div id="updated-a" class="updated"></div>
    </div>
    <button class="more-btn" id="moreBtn-a" style="display:none">顯示到今天最後一班</button>
  </div>

  <div class="board" id="board-b">
    <div class="board-title" id="title-b">北上</div>
    <div class="controls">
      <select id="stationSelect-b" aria-label="車站"><option>載入車站中…</option></select>
      <select id="directionSelect-b" aria-label="方向"></select>
    </div>
    <div class="card">
      <div id="list-b" class="loading">查詢中…</div>
      <div id="updated-b" class="updated"></div>
    </div>
    <button class="more-btn" id="moreBtn-b" style="display:none">顯示到今天最後一班</button>
  </div>

  <button class="refresh-btn" id="refreshBtn">重新查詢</button>

  <p class="disclaimer">
    本資料為台鐵時刻表加上誤點資訊所合成，約有 2 分鐘延遲，並非車站第一手資料，僅供參考。
  </p>

  <details>
    <summary>怎麼把這個網頁加到手機主畫面？</summary>
    <div class="howto">
      <h3>📱 iPhone（Safari）</h3>
      <p>
        用 Safari 瀏覽器打開這個網頁 → 按下方中間的「分享」圖示（方框加箭頭）
        → 往下找「加入主畫面」→ 按「加入」。
      </p>
      <h3>🤖 Android（Chrome）</h3>
      <p>
        用 Chrome 瀏覽器打開這個網頁 → 按右上角「⋮」三個點
        → 選「新增至主畫面」或「安裝應用程式」→ 按「新增」。
      </p>
      <p style="color: var(--muted); font-size: 13px;">
        加入後，手機桌面會多一個圖示，點一下就能直接查看，跟開 App 一樣方便。
      </p>
    </div>
  </details>
</div>

<script>
  const DEFAULT_COUNT = 3; // show the N nearest trains by default
  const REFRESH_MS = 3 * 60 * 1000; // match the backend's live-board cache window
  const MIN_LOAD_GAP_MS = 20 * 1000; // guard against any runaway/duplicate triggers

  function storageGet(key) {
    try {
      return localStorage.getItem(key);
    } catch {
      return null;
    }
  }
  function storageSet(key, value) {
    try {
      localStorage.setItem(key, value);
    } catch {
      /* ignore (private browsing etc.) */
    }
  }

  function fmtUpdateTime(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    const hh = String(d.getHours()).padStart(2, "0");
    const mm = String(d.getMinutes()).padStart(2, "0");
    return `資料時間 ${hh}:${mm}`;
  }

  function trainHtml(t) {
    let badge = "";
    if (t.suspended) {
      badge = `<div class="suspended-tag">今日停駛</div>`;
    } else if (t.delayMinutes > 0) {
      badge = `<div class="delay">誤點 ${t.delayMinutes} 分</div>`;
    }
    return `
      <div class="train ${t.suspended ? "suspended" : ""}">
        <div class="time">${t.time.slice(0, 5)}</div>
        <div class="mid">
          <div class="trainNo">${t.trainType} ${t.trainNo}</div>
          <div class="meta">往 ${t.destination}</div>
        </div>
        ${badge}
      </div>
    `;
  }

  // One `Board` = one station + direction picker, independently configurable
  // and persisted, so two boards can show e.g. 百福 southbound and 汐科
  // northbound side by side.
  function createBoard({ suffix, defaultStation, preferredDirection }) {
    const el = (id) => document.getElementById(`${id}-${suffix}`);
    const titleEl = el("title");
    const stationSelect = el("stationSelect");
    const directionSelect = el("directionSelect");
    const listEl = el("list");
    const updatedEl = el("updated");
    const moreBtn = el("moreBtn");

    const STORAGE_STATION = `train-liveboard:station:${suffix}`;
    const STORAGE_DIRECTION_PREFIX = `train-liveboard:direction:${suffix}:`;

    let allTrains = [];
    let showAll = false;
    let lastData = null;
    let stationsReady = false;
    let lastLoadAt = 0;

    function renderList() {
      const visible = showAll ? allTrains : allTrains.slice(0, DEFAULT_COUNT);

      if (visible.length === 0) {
        listEl.className = "empty";
        listEl.textContent = showAll ? "今天沒有更多列車了" : "目前沒有列車資料";
      } else {
        listEl.className = "";
        listEl.innerHTML = visible.map(trainHtml).join("");
      }

      const hasMore = allTrains.length > DEFAULT_COUNT;
      moreBtn.style.display = hasMore ? "block" : "none";
      moreBtn.textContent = showAll ? "收合" : "顯示到今天最後一班";
    }

    function populateDirections(stationId, directionOptions) {
      const savedDirection = storageGet(STORAGE_DIRECTION_PREFIX + stationId);
      directionSelect.innerHTML = directionOptions
        .map((d) => `<option value="${d.value}">${d.label}</option>`)
        .join("");
      const validValues = directionOptions.map((d) => String(d.value));
      const fallback = validValues.includes(String(preferredDirection))
        ? String(preferredDirection)
        : directionOptions[0]?.value ?? "";
      directionSelect.value = validValues.includes(savedDirection) ? savedDirection : fallback;
    }

    // Re-renders from the last fetched response using whatever direction is
    // currently selected — no network call needed to switch direction.
    function applyDirection() {
      if (!lastData) return;
      const selectedDirection = Number(directionSelect.value);
      const directionLabel =
        lastData.directionOptions.find((d) => d.value === selectedDirection)?.label || "";

      titleEl.textContent = `${lastData.stationName}站 · ${directionLabel}`;

      allTrains = (lastData.trains || []).filter((t) => t.direction === selectedDirection);
      showAll = false;
      renderList();
      updatedEl.textContent = fmtUpdateTime(lastData.updateTime);
    }

    async function load({ force = false } = {}) {
      if (!stationsReady) return; // avoid racing ahead of the station dropdown's initial load
      const stationId = stationSelect.value;
      if (!stationId) return;
      if (!force && Date.now() - lastLoadAt < MIN_LOAD_GAP_MS) return;
      lastLoadAt = Date.now();

      listEl.className = "loading";
      listEl.textContent = "查詢中…";
      try {
        const resp = await fetch(`/api/liveboard?station=${encodeURIComponent(stationId)}`);
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || "查詢失敗");

        lastData = data;
        populateDirections(stationId, data.directionOptions);
        applyDirection();
      } catch (err) {
        listEl.className = "err";
        listEl.textContent = "查詢失敗，請稍後再試";
      }
    }

    function populateStations(stations) {
      const savedStation = storageGet(STORAGE_STATION) || defaultStation;
      stationSelect.innerHTML = stations
        .map((s) => `<option value="${s.id}">${s.name}</option>`)
        .join("");

      const validIds = stations.map((s) => s.id);
      stationSelect.value = validIds.includes(savedStation) ? savedStation : defaultStation;
      stationsReady = true;
    }

    stationSelect.addEventListener("change", () => {
      storageSet(STORAGE_STATION, stationSelect.value);
      load({ force: true });
    });
    directionSelect.addEventListener("change", () => {
      storageSet(STORAGE_DIRECTION_PREFIX + stationSelect.value, directionSelect.value);
      applyDirection(); // instant, client-side only — same data, different filter
    });
    moreBtn.addEventListener("click", () => {
      showAll = !showAll;
      renderList();
    });

    return {
      async init(stations) {
        populateStations(stations);
        await load({ force: true });
      },
      refresh: () => load({ force: false }),
      forceRefresh: () => load({ force: true }),
    };
  }

  // A short, curated list of nearby stations — not the full ~245 TRA
  // stations, since the family only ever uses this handful.
  const COMMON_STATIONS = [
    { id: "0920", name: "八堵" },
    { id: "0930", name: "七堵" },
    { id: "0940", name: "百福" },
    { id: "0960", name: "汐止" },
    { id: "0970", name: "汐科" },
    { id: "0980", name: "南港" },
    { id: "0990", name: "松山" },
    { id: "1000", name: "臺北" },
  ];

  const boardA = createBoard({ suffix: "a", defaultStation: "0940", preferredDirection: 1 }); // 百福 · 南下
  const boardB = createBoard({ suffix: "b", defaultStation: "0970", preferredDirection: 0 }); // 汐科 · 北上
  const boards = [boardA, boardB];

  const refreshBtn = document.getElementById("refreshBtn");
  refreshBtn.addEventListener("click", () => boards.forEach((b) => b.forceRefresh()));
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) boards.forEach((b) => b.refresh()); // throttled per-board by MIN_LOAD_GAP_MS
  });

  (async function init() {
    await Promise.all(boards.map((b) => b.init(COMMON_STATIONS)));
    setInterval(() => {
      if (!document.hidden) boards.forEach((b) => b.refresh());
    }, REFRESH_MS);
  })();
</script>
</body>
</html>
